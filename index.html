<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Explorer</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="bg-dark text-white py-4">
        <div class="container text-center">
            <h1>Pokémon Explorer</h1>
            <p class="mb-0">Buscá y explorá Pokémon utilizando PokeAPI</p>
        </div>
    </header>

    <main class="container py-5">

        <!-- Buscador -->
        <section class="mb-4">
            <div class="row justify-content-center">
                <div class="col-md-8">

                    <div class="input-group">
                        <input
                            type="text"
                            id="pokemonInput"
                            class="form-control"
                            placeholder="Ingresá el nombre o ID de un Pokémon"
                        >

                        <button
                            id="searchButton"
                            class="btn btn-primary"
                            type="button"
                        >
                            Buscar
                        </button>

                        <button
                            id="resetButton"
                            class="btn btn-secondary"
                            type="button"
                        >
                            Volver
                        </button>
                    </div>

                </div>
            </div>
        </section>

        <!-- spinner -->
        <div
            id="loading"
            class="text-center my-5 d-none"
        >
            <div
                class="spinner-border text-primary"
                role="status"
            >
                <span class="visually-hidden">Cargando...</span>
            </div>

            <p class="mt-2">Cargando Pokemon...</p>
        </div>

        <!-- Contenedor de Pokemon -->
        <section>
            <div
                id="pokemonContainer"
                class="row g-4"
            ></div>
        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">Pokemon Explorer - Trabajo Practico Individual 2</p>
    </footer>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- JavaScript principal -->
    <script
        type="module"
        src="js/main.js"
    ></script>

</body>
</html>
